name: Create release PR

# Opens the pull request that releases main to production, through the GitHub API only: from a release-<sha>
# branch frozen at the main commit the workflow runs on, so what gets approved is what ships. The production
# ruleset requires one approval and a merge commit.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: create-release-pr
  cancel-in-progress: false

jobs:
  create-release-pr:
    # "Run workflow" lets you pick any branch; only main is released
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # cos-robot's token, so that ci.yml runs on the pull request: one opened with GITHUB_TOKEN starts no workflow.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PACKAGE_DIR: packages/cos-inspection-service
      REQUESTED_BY: ${{ github.triggering_actor }}
    steps:
      - name: Open the release pull request
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          short="${sha:0:10}"
          branch="release-$short"

          gh api "repos/$GH_REPO/compare/production...$sha" > compare.json
          if [ "$(jq .ahead_by compare.json)" = "0" ]; then
            echo "::notice::production already has main at $short: nothing to release."
            exit 0
          fi

          open=$(gh pr list --base production --state open --json url --jq '.[0].url // empty')
          if [ -n "$open" ]; then
            echo "::error::A release pull request is already open: $open. Merge or close it first."
            exit 1
          fi

          version=$(gh api "repos/$GH_REPO/contents/$PACKAGE_DIR/package.json?ref=$sha" --jq .content | base64 -d | jq -r .version)
          changes=$(jq -r '[.commits[].commit.message | split("\n")[0] | select(startswith("chore(release)") | not)]
            | reverse | map("- " + .) | join("\n")' compare.json)
          migrations=$(jq -r --arg dir "$PACKAGE_DIR/prisma/migrations/" '[.files[]
            | select(.status == "added" and (.filename | startswith($dir)) and (.filename | endswith("/migration.sql")))
            | "- `" + (.filename | split("/")[-2]) + "`"] | join("\n")' compare.json)

          {
            echo "Releases \`main\` at $short to production. Requested by @$REQUESTED_BY."
            echo
            echo "**Version:** $version"
            echo
            echo "**Changes**"
            echo
            echo "${changes:-- None}"
            echo
            echo "**Prisma migrations** (\`release.sh\` runs them before the deploy)"
            echo
            echo "${migrations:-- None}"
          } > body.md

          gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$sha" > /dev/null
          url=$(gh pr create --base production --head "$branch" \
            --title "chore: [SHIP] Release from $short" \
            --body-file body.md \
            --assignee "$REQUESTED_BY")

          echo "Release pull request: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "$url"
